name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag, branch, or SHA to build (e.g., v0.8.7 or main)"
        required: true
        type: string
      publish_latest:
        description: "Also update the latest and migrate aliases"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: guji08233/tokenarena

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      security-events: write

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Resolve checked-out source
        id: source
        env:
          REQUESTED_REF: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$REQUESTED_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]]; then
            echo "Invalid Git ref for an image tag: $REQUESTED_REF" >&2
            exit 1
          fi

          case "$REQUESTED_REF" in
            latest|migrate|buildcache)
              echo "Reserved container image tag: $REQUESTED_REF" >&2
              exit 1
              ;;
          esac

          if [[ "$REQUESTED_REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            EXPECTED_VERSION="${BASH_REMATCH[1]}" node <<'NODE'
          const fs = require("node:fs");
          const expected = process.env.EXPECTED_VERSION;
          const packages = ["package.json", "cli/package.json", "web/package.json"];

          for (const file of packages) {
            const version = JSON.parse(fs.readFileSync(file, "utf8")).version;
            if (version !== expected) {
              throw new Error(`${file} version ${version} does not match requested ref v${expected}`);
            }
          }
          NODE
          fi

          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:7}"
          {
            echo "version=$REQUESTED_REF"
            echo "sha=$source_sha"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"

          echo "Building $REQUESTED_REF at $source_sha"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          context: git
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.source.outputs.version }}
            type=raw,value=${{ steps.source.outputs.short_sha }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}

      - name: Extract migrate metadata
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          context: git
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.source.outputs.version }}-migrate
            type=raw,value=${{ steps.source.outputs.short_sha }}-migrate
            type=raw,value=migrate,enable=${{ inputs.publish_latest }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}-migrate

      - name: Build and push Docker image (migrate)
        id: build-migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          target: migrate
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,compression=zstd,oci-mediatypes=true

      - name: Build and push Docker image (web)
        id: build-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.source.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,compression=zstd,oci-mediatypes=true

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-web.outputs.digest }}
          severity: CRITICAL
          exit-code: 0
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
